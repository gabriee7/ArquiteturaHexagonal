services:
  contratacao-api:
    build:
      context: .
      dockerfile: src/ContratacaoService.API/Dockerfile
    container_name: contratacao-api
    restart: on-failure
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=contratacao_db;Username=admin;Password=admin;
      - Services__PropostaApiBaseUrl=http://proposta-api:8080
      - RabbitMq__Host=rabbitmq
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - shared-net
    volumes:
      - ./contratacao-logs:/app/Logs

volumes:
  postgres_data:
    name: seguradora-postgres-data

networks:
  shared-net:
    name: seguradora-network
    driver: bridge